onboarding = false

[keys]
prefix = "ctrl+q"
detach = "prefix+shift+q"
split_vertical = "prefix+_"
split_horizontal = "prefix+-"
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
open_worktree = "prefix+ctrl+o"
remove_worktree = "prefix+ctrl+d"

[ui]
pane_borders = true
pane_gaps = true

agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
